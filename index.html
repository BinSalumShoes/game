<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIPER MOBILE - Snake Battle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #080b11;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            width: 100%;
            max-width: 450px;
            height: 100%;
            max-height: 850px;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            border: 2px solid #334155;
        }

        /* --- SCREENS --- */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            z-index: 10;
            text-align: center;
        }
        .hidden { display: none !important; }

        .logo {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(to right, #38bdf8, #eab308, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        .slogan {
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin: 8px 0;
            width: 100%;
            max-width: 260px;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            transition: 0.15s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-gold { background: #eab308; color: #000; box-shadow: 0 4px 15px rgba(234, 179, 8, 0.3); }
        .btn-danger { background: #ef4444; color: #fff; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }

        /* --- HUD & GAME BOARD --- */
        #gameScreen { background: #080b11; justify-content: flex-start; padding: 15px; }
        .hud-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            border: 1px solid #334155;
        }
        canvas {
            background: #020617;
            border-radius: 12px;
            border: 2px solid #334155;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            display: block;
            margin: 0 auto;
        }

        /* --- CONTROLS --- */
        .controls {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        .ctrl-btn {
            background: #1e293b;
            border: 1px solid #475569;
            color: #fff;
            font-size: 22px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .ctrl-btn:active { background: #38bdf8; color: #0f172a; }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        /* --- SKINS & SHOP --- */
        .skins-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 280px;
            margin: 15px 0;
        }
        .skin-card {
            background: #1e293b;
            border: 2px solid #334155;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
        }
        .skin-card.selected { border-color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
        .skin-preview { width: 30px; height: 10px; border-radius: 5px; margin: 5px auto; }

        /* --- LEADERBOARD --- */
        .lb-list {
            width: 100%;
            max-width: 280px;
            background: #1e293b;
            border-radius: 10px;
            padding: 10px;
            margin: 15px 0;
            max-height: 200px;
            overflow-y: auto;
        }
        .lb-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 10px;
            border-bottom: 1px solid #334155;
            font-size: 13px;
        }
        .lb-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <div class="game-container">

        <!-- 1. MAIN MENU -->
        <div id="menuScreen" class="screen">
            <div class="logo">VIPER SNAKE</div>
            <div class="slogan">Rule the Battle. Fear the Viper.</div>
            
            <div style="font-size: 14px; color: #eab308; margin-bottom: 15px;">💰 Coins: <span id="menuCoins">0</span></div>
            
            <button class="btn btn-gold" onclick="openModeSelect()">PLAY GAME</button>
            <button class="btn" onclick="openSkins()">SNAKE SKINS</button>
            <button class="btn" onclick="openLeaderboard()">LEADERBOARD</button>
        </div>

        <!-- 2. MODE SELECT -->
        <div id="modeScreen" class="screen hidden">
            <div class="logo">SELECT MODE</div>
            <button class="btn" onclick="startGame('classic')">Classic Mode</button>
            <button class="btn btn-gold" onclick="startGame('survival')">Survival Mode (Obstacles)</button>
            <button class="btn btn-danger" onclick="startGame('battle')">Battle Mode (AI Rivals)</button>
            <button class="btn" style="background:#334155; color:#fff;" onclick="backToMenu()">Back</button>
        </div>

        <!-- 3. GAME SCREEN -->
        <div id="gameScreen" class="screen hidden">
            <div class="hud-bar">
                <div>Score: <span id="scoreVal">0</span></div>
                <div>💰 <span id="coinVal">0</span></div>
                <div id="powerupStatus" style="color: #eab308; font-size: 12px;"></div>
                <button onclick="pauseGame()" style="background:none; border:none; color:#fff; font-size:18px; cursor:pointer;">⏸️</button>
            </div>

            <canvas id="gameCanvas" width="360" height="420"></canvas>

            <div class="controls">
                <button class="ctrl-btn btn-up" onclick="setDir(0, -1)">▲</button>
                <button class="ctrl-btn btn-left" onclick="setDir(-1, 0)">◀</button>
                <button class="ctrl-btn btn-down" onclick="setDir(0, 1)">▼</button>
                <button class="ctrl-btn btn-right" onclick="setDir(1, 0)">▶</button>
            </div>
        </div>

        <!-- 4. SKINS SHOP -->
        <div id="skinsScreen" class="screen hidden">
            <div class="logo">SNAKE SKINS</div>
            <div style="font-size: 14px; color: #eab308; margin-bottom: 10px;">Coins: <span id="shopCoins">0</span></div>
            
            <div class="skins-grid" id="skinsContainer"></div>
            <button class="btn" style="margin-top: 15px;" onclick="backToMenu()">Back</button>
        </div>

        <!-- 5. LEADERBOARD -->
        <div id="leaderboardScreen" class="screen hidden">
            <div class="logo">GLOBAL LEADERBOARD</div>
            <div class="lb-list" id="leaderboardList"></div>
            <button class="btn" onclick="backToMenu()">Back</button>
        </div>

        <!-- 6. GAME OVER -->
        <div id="gameOverScreen" class="screen hidden">
            <div class="logo" style="color: #ef4444;">GAME OVER</div>
            <p style="margin: 10px 0; color: #cbd5e1;">Final Score: <span id="finalScore" style="color:#38bdf8; font-weight:bold;">0</span></p>
            <p style="margin-bottom: 20px; color: #eab308;">Coins Earned: +<span id="earnedCoins">0</span></p>
            <button class="btn btn-gold" onclick="restartGame()">PLAY AGAIN</button>
            <button class="btn" onclick="backToMenu()">Main Menu</button>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const GRID_SIZE = 15;
        const TILE_COUNT_X = canvas.width / GRID_SIZE;
        const TILE_COUNT_Y = canvas.height / GRID_SIZE;

        // Player Data & LocalStorage
        let playerData = JSON.parse(localStorage.getItem('viper_snake_data')) || {
            coins: 100,
            selectedSkin: 'neon',
            unlockedSkins: ['neon']
        };

        const skins = [
            { id: 'neon', name: 'Neon Blue', color: '#38bdf8', price: 0 },
            { id: 'gold', name: 'Golden Viper', color: '#eab308', price: 50 },
            { id: 'fire', name: 'Magma Red', color: '#ef4444', price: 100 },
            { id: 'toxic', name: 'Toxic Green', color: '#22c55e', price: 150 }
        ];

        let globalLeaderboard = [
            { name: "ViperKing", score: 320 },
            { name: "Shadow", score: 250 },
            { name: "Ghost", score: 180 },
            { name: "Sule", score: 140 }
        ];

        let gameInterval = null;
        let currentMode = 'classic';
        let score = 0;
        let sessionCoins = 0;
        let isPaused = false;

        let snake = [];
        let dx = 1, dy = 0;
        let nextDx = 1, nextDy = 0;
        let food = { x: 0, y: 0, type: 'normal' };
        let obstacles = [];
        let enemies = [];
        let activePowerup = null;
        let powerupTimer = 0;

        function saveGame() {
            localStorage.setItem('viper_snake_data', JSON.stringify(playerData));
        }

        function updateUI() {
            document.getElementById('menuCoins').innerText = playerData.coins;
            document.getElementById('shopCoins').innerText = playerData.coins;
        }
        updateUI();

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
        }

        function openModeSelect() { showScreen('modeScreen'); }
        
        function backToMenu() { 
            clearInterval(gameInterval); 
            updateUI(); 
            showScreen('menuScreen'); 
        }

        // --- ANDROID / PHONE BACK BUTTON HANDLER ---
        window.addEventListener('popstate', (event) => {
            event.preventDefault();
            backToMenu();
            history.pushState(null, null, window.location.href);
        });
        // Push state initially so back button works smoothly
        history.pushState(null, null, window.location.href);

        function openSkins() {
            const container = document.getElementById('skinsContainer');
            container.innerHTML = '';
            skins.forEach(skin => {
                const isUnlocked = playerData.unlockedSkins.includes(skin.id);
                const isSelected = playerData.selectedSkin === skin.id;
                
                const card = document.createElement('div');
                card.className = `skin-card ${isSelected ? 'selected' : ''}`;
                card.innerHTML = `
                    <div style="font-size:12px; font-weight:bold;">${skin.name}</div>
                    <div class="skin-preview" style="background:${skin.color};"></div>
                    <div style="font-size:11px; color:${isUnlocked ? '#22c55e' : '#eab308'};">
                        ${isUnlocked ? (isSelected ? 'Selected' : 'Equip') : '💰 ' + skin.price}
                    </div>
                `;
                card.onclick = () => {
                    if (isUnlocked) {
                        playerData.selectedSkin = skin.id;
                        saveGame();
                        openSkins();
                    } else if (playerData.coins >= skin.price) {
                        playerData.coins -= skin.price;
                        playerData.unlockedSkins.push(skin.id);
                        playerData.selectedSkin = skin.id;
                        saveGame();
                        openSkins();
                    } else {
                        alert("Not enough coins!");
                    }
                };
                container.appendChild(card);
            });
            showScreen('skinsScreen');
        }

        function openLeaderboard() {
            const list = document.getElementById('leaderboardList');
            list.innerHTML = '';
            globalLeaderboard.sort((a, b) => b.score - a.score).forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'lb-item';
                row.innerHTML = `<span>#${index+1} ${item.name}</span> <strong style="color:#38bdf8;">${item.score}</strong>`;
                list.appendChild(row);
            });
            showScreen('leaderboardScreen');
        }

        // --- GAME LOGIC ---
        function startGame(mode) {
            currentMode = mode;
            showScreen('gameScreen');
            
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1; dy = 0;
            nextDx = 1; nextDy = 0;
            score = 0;
            sessionCoins = 0;
            obstacles = [];
            enemies = [];
            activePowerup = null;
            powerupTimer = 0;

            document.getElementById('scoreVal').innerText = score;
            document.getElementById('coinVal').innerText = sessionCoins;
            document.getElementById('powerupStatus').innerText = '';

            if (mode === 'survival') {
                for (let i = 0; i < 6; i++) {
                    obstacles.push({ x: Math.floor(Math.random() * TILE_COUNT_X), y: Math.floor(Math.random() * TILE_COUNT_Y) });
                }
            } else if (mode === 'battle') {
                enemies.push({
                    body: [{ x: 5, y: 5 }, { x: 5, y: 6 }, { x: 5, y: 7 }],
                    dx: 0, dy: -1, color: '#ef4444'
                });
            }

            spawnFood();
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 110);
        }

        function setDir(x, y) {
            if (x !== -dx || y !== -dy) {
                nextDx = x;
                nextDy = y;
            }
        }

        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp' || e.key === 'w') setDir(0, -1);
            if (e.key === 'ArrowDown' || e.key === 's') setDir(0, 1);
            if (e.key === 'ArrowLeft' || e.key === 'a') setDir(-1, 0);
            if (e.key === 'ArrowRight' || e.key === 'd') setDir(1, 0);
        });

        function spawnFood() {
            food.x = Math.floor(Math.random() * TILE_COUNT_X);
            food.y = Math.floor(Math.random() * TILE_COUNT_Y);
            
            const rand = Math.random();
            if (rand < 0.5) food.type = 'normal';
            else if (rand < 0.7) food.type = 'coin';
            else if (rand < 0.8) food.type = 'speed';
            else if (rand < 0.9) food.type = 'shield';
            else food.type = 'magnet';
        }

        function gameLoop() {
            if (isPaused) return;
            dx = nextDx;
            dy = nextDy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            if (head.x < 0 || head.x >= TILE_COUNT_X || head.y < 0 || head.y >= TILE_COUNT_Y) {
                if (activePowerup === 'shield') {
                    activePowerup = null;
                    head.x = (head.x + TILE_COUNT_X) % TILE_COUNT_X;
                    head.y = (head.y + TILE_COUNT_Y) % TILE_COUNT_Y;
                } else {
                    gameOver();
                    return;
                }
            }

            for (let part of snake) {
                if (head.x === part.x && head.y === part.y) {
                    if (activePowerup === 'shield') activePowerup = null;
                    else { gameOver(); return; }
                }
            }

            if (currentMode === 'survival') {
                for (let obs of obstacles) {
                    if (head.x === obs.x && head.y === obs.y) {
                        if (activePowerup === 'shield') activePowerup = null;
                        else { gameOver(); return; }
                    }
                }
            }

            if (activePowerup === 'magnet' && Math.abs(head.x - food.x) + Math.abs(head.y - food.y) < 5) {
                if (food.x < head.x) food.x++;
                if (food.x > head.x) food.x--;
                if (food.y < head.y) food.y++;
                if (food.y > head.y) food.y--;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                if (food.type === 'coin') {
                    sessionCoins += 5;
                } else if (food.type === 'speed') {
                    activePowerup = 'speed';
                    powerupTimer = 30;
                } else if (food.type === 'shield') {
                    activePowerup = 'shield';
                    powerupTimer = 40;
                } else if (food.type === 'magnet') {
                    activePowerup = 'magnet';
                    powerupTimer = 35;
                } else {
                    score += 10;
                    sessionCoins += 1;
                }
                document.getElementById('scoreVal').innerText = score;
                document.getElementById('coinVal').innerText = sessionCoins;
                spawnFood();
            } else {
                snake.pop();
            }

            if (activePowerup) {
                powerupTimer--;
                document.getElementById('powerupStatus').innerText = `${activePowerup.toUpperCase()} (${powerupTimer})` ;
                if (powerupTimer <= 0) {
                    activePowerup = null;
                    document.getElementById('powerupStatus').innerText = '';
                }
            }

            if (currentMode === 'battle') {
                enemies.forEach(enemy => {
                    if (enemy.body[0].x < food.x) enemy.dx = 1, enemy.dy = 0;
                    else if (enemy.body[0].x > food.x) enemy.dx = -1, enemy.dy = 0;
                    else if (enemy.body[0].y < food.y) enemy.dx = 0, enemy.dy = 1;
                    else if (enemy.body[0].y > food.y) enemy.dx = 0, enemy.dy = -1;

                    const eHead = { x: enemy.body[0].x + enemy.dx, y: enemy.body[0].y + enemy.dy };
                    enemy.body.unshift(eHead);
                    enemy.body.pop();

                    for (let part of enemy.body) {
                        if (head.x === part.x && head.y === part.y) {
                            gameOver();
                            return;
                        }
                    }
                });
            }

            draw();
        }

        // --- REALISTIC SNAKE DRAWING FUNCTION ---
        function drawRealisticSnake(bodySegments, skinColor) {
            bodySegments.forEach((part, index) => {
                const x = part.x * GRID_SIZE + GRID_SIZE / 2;
                const y = part.y * GRID_SIZE + GRID_SIZE / 2;
                const radius = GRID_SIZE / 2 - 1;

                if (index === 0) {
                    // --- SNAKE HEAD ---
                    ctx.save();
                    ctx.translate(x, y);
                    
                    // Rotate head based on direction
                    let angle = 0;
                    if (dx === 1) angle = 0;
                    else if (dx === -1) angle = Math.PI;
                    else if (dy === 1) angle = Math.PI / 2;
                    else if (dy === -1) angle = -Math.PI / 2;
                    ctx.rotate(angle);

                    // Head base shape
                    ctx.fillStyle = skinColor;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, radius, radius - 1, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Eyes
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(3, -4, 2.5, 0, Math.PI * 2);
                    ctx.arc(3, 4, 2.5, 0, Math.PI * 2);
                    ctx.fill();

                    // Pupils
                    ctx.fillStyle = '#000000';
                    ctx.beginPath();
                    ctx.arc(4, -4, 1, 0, Math.PI * 2);
                    ctx.arc(4, 4, 1, 0, Math.PI * 2);
                    ctx.fill();

                    // Tongue flick
                    ctx.strokeStyle = '#ef4444';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(radius, 0);
                    ctx.lineTo(radius + 4, 0);
                    ctx.stroke();

                    ctx.restore();
                } else {
                    // --- SNAKE BODY SEGMENTS (SMOOTH & ORGANIC) ---
                    ctx.fillStyle = skinColor;
                    ctx.beginPath();
                    ctx.arc(x, y, radius - 1, 0, Math.PI * 2);
                    ctx.fill();

                    // Add subtle inner texture ring for realism
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.25)';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
            });
        }

        function draw() {
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Obstacles
            if (currentMode === 'survival') {
                ctx.fillStyle = '#64748b';
                obstacles.forEach(obs => {
                    ctx.fillRect(obs.x * GRID_SIZE, obs.y * GRID_SIZE, GRID_SIZE - 2, GRID_SIZE - 2);
                });
            }

            // Draw Food / Powerup
            if (food.type === 'normal') ctx.fillStyle = '#ef4444';
            else if (food.type === 'coin') ctx.fillStyle = '#eab308';
            else if (food.type === 'speed') ctx.fillStyle = '#38bdf8';
            else if (food.type === 'shield') ctx.fillStyle = '#a855f7';
            else if (food.type === 'magnet') ctx.fillStyle = '#ec4899';
            
            ctx.beginPath();
            ctx.arc(food.x * GRID_SIZE + GRID_SIZE/2, food.y * GRID_SIZE + GRID_SIZE/2, GRID_SIZE/2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // Draw Player Snake with Realistic Appearance
            const currentSkinObj = skins.find(s => s.id === playerData.selectedSkin) || skins[0];
            drawRealisticSnake(snake, currentSkinObj.color);

            // Draw Enemies
            if (currentMode === 'battle') {
                enemies.forEach(enemy => {
                    drawRealisticSnake(enemy.body, enemy.color);
                });
            }
        }

        function gameOver() {
            clearInterval(gameInterval);
            playerData.coins += sessionCoins;
            globalLeaderboard.push({ name: "You", score: score });
            saveGame();

            document.getElementById('finalScore').innerText = score;
            document.getElementById('earnedCoins').innerText = sessionCoins;
            showScreen('gameOverScreen');
        }

        function restartGame() {
            startGame(currentMode);
        }

        function pauseGame() {
            isPaused = !isPaused;
        }
    </script>
</body>
</html>
